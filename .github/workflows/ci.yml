name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: sh scripts/record-results.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.os }}
          path: test/results/latest
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      # Job logs can't be read from Claude sessions, so failing lines become annotations.
      - name: Tests
        shell: bash
        run: |
          go test -count=1 -v ./... > tests.log 2>&1 || { grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+' tests.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
      - name: Race tests
        shell: bash
        run: |
          go test -race -count=1 ./... > race.log 2>&1 || { grep -E -- '--- FAIL|^FAIL|panic:|_test\.go:[0-9]+|DATA RACE' race.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
